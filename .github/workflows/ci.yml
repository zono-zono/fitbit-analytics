name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 今回の漏洩は .gitignore をすり抜けた plan ファイルが原因だった。
  # ファイル名では防げないので、中身を走査する。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 履歴全体を対象にする

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks はバイナリの plan を取りこぼす。中身の構造で判定する。
      - name: Terraform の state / plan がコミットされていないか
        run: python3 scripts/check_tf_artifacts.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform -chdir=terraform fmt -check -diff

      # backend は -backend-config で外から渡すため、検証では初期化しない
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m compileall -q main.py get_gss.py upload_gss.py

      - name: requirements.txt がパースできることを確認
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          from packaging.requirements import Requirement
          for line in open("requirements.txt"):
              line = line.strip()
              if line and not line.startswith("#"):
                  Requirement(line)
          print("ok")
          PY
